# Package build + metadata now live in release/BUILD.bazel (Bazel py_wheel;
# the canonical and only supported build of the published wheel is
# `//release:wheel`). This file retains only pytest config.

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::PendingDeprecationWarning",
]
addopts = "-q --tb=short"
