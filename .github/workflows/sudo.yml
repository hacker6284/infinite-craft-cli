name: sudo kernel

# Division of labor: Bazel (.github/workflows/test.yml) owns host Python
# tests, including host-parity lockstep (//tests/parity:parity_test).
# This workflow owns toolchain integration — generating kernel adapters
# via the pinned sudoc release (scripts/generate.sh / scripts/sudoc-bin.sh),
# node smoke, and the bookmarklet bundle/artifact.

on:
  push:
    branches: [main, sudo-kernel]
  pull_request:

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Generate kernel adapters (py + js)
        run: bash scripts/generate.sh

      - name: Kernel smoke (node, ex-bug behaviors)
        run: node bookmarklet/test_kernel_smoke.mjs

      - name: Bundle bookmarklet
        run: bash bookmarklet/minify.sh

      - name: Upload built bookmarklet
        uses: actions/upload-artifact@v4
        with:
          name: bookmarklet
          path: |
            bookmarklet/trainer.js
            bookmarklet/trainer.min.js

  # Pages deployment lives in pages.yml, which rebuilds the site from
  # source (kernel transpile + bundle) on every main push.
