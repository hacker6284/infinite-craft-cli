name: Deploy Bookmarklet to GitHub Pages

# Deploys are release-gated: the site (which live extensions/userscripts
# fetch) updates only when a v* tag is pushed — the same gate as PyPI —
# or on explicit manual dispatch. Merges to main never auto-deploy.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: bazel-contrib/setup-bazel@0.14.0
        with:
          bazelisk-cache: true
          disk-cache: ${{ github.workflow }}
          repository-cache: true

      # The deployed site is built from source every time — the sudo kernel
      # is transpiled and the trainer re-bundled by Bazel, so Pages can never
      # serve an artifact that drifted from sudo/craft.sudo.
      - name: Build site
        run: bazel build //bookmarklet:site

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: bazel-bin/bookmarklet/site
      - id: deployment
        uses: actions/deploy-pages@v4
