name: Publish to PyPI

on:
  push:
    tags:
      - 'v*'

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - uses: bazel-contrib/setup-bazel@0.14.0
        with:
          bazelisk-cache: true
          disk-cache: ${{ github.workflow }}
          repository-cache: true

      - name: Build wheel
        run: bazel build //release:wheel.dist

      - name: Stage wheel (refuse a mismatched version)
        run: |
          mkdir -p dist
          cp bazel-bin/release/wheel_dist/*.whl dist/
          # This workflow only triggers on tag pushes (v*), so the intended
          # version is known exactly — require the staged wheel to match it.
          # A tagless/shallow checkout would stamp 0.0.0 (workspace_status.sh);
          # this also catches that, plus any other stamping mismatch.
          EXPECTED="${GITHUB_REF_NAME#v}"
          WHEEL="$(ls dist/*-py3-none-any.whl 2>/dev/null | head -n1 || true)"
          if [ -z "$WHEEL" ]; then
            echo "::error::no wheel found in dist/ — build step did not produce a wheel"
            exit 1
          fi
          WHEEL_BASENAME="$(basename "$WHEEL")"
          # Filename shape: infinite_craft_cli-<version>-py3-none-any.whl
          ACTUAL="${WHEEL_BASENAME#infinite_craft_cli-}"
          ACTUAL="${ACTUAL%-py3-none-any.whl}"
          if [ "$ACTUAL" != "$EXPECTED" ]; then
            echo "::error::wheel version '${ACTUAL}' does not match tag version '${EXPECTED}' — refusing to publish"
            exit 1
          fi

      - name: Wheel actually contains the kernel
        run: |
          python3 -m venv /tmp/icw
          /tmp/icw/bin/pip install dist/*.whl
          /tmp/icw/bin/python -c "import infinite_craft_cli._sudo.craft; print('kernel import OK')"

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1

  release:
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Extract changelog for this version
        id: changelog
        run: |
          # Extract the version from the tag (strip leading 'v')
          VERSION="${GITHUB_REF_NAME#v}"
          # Pull the section for this version from CHANGELOG.md
          # Matches from "## [X.Y.Z]" to the next "## [" or end of file
          NOTES=$(awk "/^## \\[${VERSION}\\]/{found=1; next} /^## \\[/{if(found) exit} found{print}" CHANGELOG.md)
          # Write to file for the release body (handles multiline safely)
          echo "$NOTES" > /tmp/release_notes.md

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          body_path: /tmp/release_notes.md
          generate_release_notes: false
