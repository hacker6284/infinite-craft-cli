name: Publish to PyPI

on:
  push:
    tags:
      - 'v*'

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@v4

      # The kernel is generated code and gitignored — the package is
      # incomplete (ImportError on infinite_craft_cli._sudo) unless the
      # sudo sources are transpiled (via the pinned sudoc release) before
      # building.
      - name: Generate kernel adapters
        run: bash scripts/generate.sh

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install build tools
        run: pip install build

      - name: Build package
        run: python -m build

      - name: Wheel actually contains the kernel
        run: |
          pip install dist/*.whl
          python -c "import infinite_craft_cli._sudo.craft; print('kernel import OK')"

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1

  release:
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Extract changelog for this version
        id: changelog
        run: |
          # Extract the version from the tag (strip leading 'v')
          VERSION="${GITHUB_REF_NAME#v}"
          # Pull the section for this version from CHANGELOG.md
          # Matches from "## [X.Y.Z]" to the next "## [" or end of file
          NOTES=$(awk "/^## \\[${VERSION}\\]/{found=1; next} /^## \\[/{if(found) exit} found{print}" CHANGELOG.md)
          # Write to file for the release body (handles multiline safely)
          echo "$NOTES" > /tmp/release_notes.md

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          body_path: /tmp/release_notes.md
          generate_release_notes: false
